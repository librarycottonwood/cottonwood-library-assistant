name: Close stale website saves
on:
  schedule:
    # Daily, 09:23 Pacific standard time / 10:23 Pacific daylight time.
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be closed'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: library-stale-saves
  cancel-in-progress: false
jobs:
  close:
    if: github.repository == 'librarycottonwood/cottonwood-library-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Branch deletion, closing comments and artifact cleanup. Never touches main or Sanity.
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Close content saves with no activity for 14 days
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/stale-saves.mjs
      - name: Remove previews of closed saves
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cms-artifacts.py
