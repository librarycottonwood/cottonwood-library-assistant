name: Library notification rehearsal
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create and merge an isolated notification-only rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          base=codex/upkeep-test-notify
          head=codex/upkeep-test-notify-head
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$base" -f sha="$main"
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$head" -f sha="$main"
          content=$(printf 'Isolated notification rehearsal. No website content changed.\n' | base64 -w0)
          gh api "repos/$REPO/contents/assistant/notification-rehearsal.txt" -X PUT -f branch="$head" -f message='Isolated notification rehearsal' -f content="$content"
          url=$(gh pr create --repo "$REPO" --base "$base" --head "$head" --title 'Library website upkeep' --body 'Administrator notification rehearsal on an isolated test branch. No website content changed; this tests delivery only.')
          number=${url##*/}
          gh api "repos/$REPO/pulls/$number/merge" -X PUT -f merge_method=merge
          printf '%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
