name: Update library Analytics connector
on:
  workflow_run:
    workflows: ['Verify library website']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: library-analytics-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      state: ${{ steps.deploy.outputs.state }}
      publish: ${{ steps.current.outputs.publish }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      # Most website saves do not touch the connector. When the hosted connector already
      # runs the same connector/ source, skip the install, test, build and deploy (and the
      # record job). Any doubt (no hosted version, a lookup error, a very large change) deploys as before.
      - name: Skip when the hosted connector already has this connector source
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          hosted=$(curl -fsS --max-time 15 https://cottonwood-library-analytics.librarycottonwood.workers.dev/health | jq -r '.sourceSha // empty' || true)
          changed=true
          if [[ "$hosted" =~ ^[0-9a-f]{40}$ ]] &&
             files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$hosted...$CHECKED_SHA" --jq 'if (.files | length) < 300 and .status != "diverged" then [.files[] | .filename, (.previous_filename // empty)] | join("\n") else "unknown" end') &&
             [ "$files" != unknown ]; then
            grep -qE '^(connector/|scripts/library-account\.mjs$)' <<< "$files" || changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then echo "The hosted connector already runs this connector source ($hosted); nothing to deploy." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changed.outputs.changed == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - if: steps.changed.outputs.changed == 'true'
        run: npm ci --prefix connector --ignore-scripts
      - if: steps.changed.outputs.changed == 'true'
        run: npm test --prefix connector
      - if: steps.changed.outputs.changed == 'true'
        run: npm run build --prefix connector
      - name: Skip a version superseded by newer main source
        id: current
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$CHECKED_SHA" ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy checked code with library-owned secrets retained
        id: deploy
        if: steps.current.outputs.publish == 'true'
        working-directory: connector
        env:
          CLOUDFLARE_ACCOUNT_ID: e05729fd6b6fad329e31896d8b1c2da9
          CLOUDFLARE_API_TOKEN: ${{ secrets.LIBRARY_ANALYTICS_DEPLOY_TOKEN }}
          LIBRARY_ANALYTICS_MONITOR_TOKEN: ${{ secrets.LIBRARY_ANALYTICS_MONITOR_TOKEN }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          WRANGLER_SEND_METRICS: 'false'
        run: node publish.mjs
      - name: Keep rollback available if deployment needs attention
        if: failure()
        run: echo 'The connector update needs attention. Previous Cloudflare Worker versions remain available for rollback; accounts, permissions and Analytics settings were not changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
  record:
    needs: publish
    # Nothing to record when the hosted connector already had this source (its last record stays current).
    if: always() && needs.publish.outputs.changed != 'false' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: library-check-records
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Record the checked deployment outcome for the weekly review
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_STATE: ${{ needs.publish.outputs.state }}
          SHOULD_PUBLISH: ${{ needs.publish.outputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          root='https://api.github.com/repos/'+repo
          def api(path, method='GET', body=None):
              request=urllib.request.Request(root+path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          state=os.environ.get('DEPLOY_STATE') or ('superseded' if os.environ['SHOULD_PUBLISH']!='true' and os.environ['PUBLISH_RESULT']=='success' else 'not_deployed')
          report={'sourceSha':os.environ['CHECKED_SHA'], 'state':state,
              'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'runUrl':f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          for suffix in ('latest',report['sourceSha']):
              path='/contents/.library-analytics-deployments/'+suffix+'.json'
              body={'branch':'maintenance-reports','message':'Record library Analytics deployment outcome',
                  'content':base64.b64encode((json.dumps(report,indent=2)+'\n').encode()).decode()}
              try:
                  body['sha']=api(path+'?ref=maintenance-reports')['sha']
              except urllib.error.HTTPError as error:
                  if error.code!=404: raise
              api(path,'PUT',body)
          PY
