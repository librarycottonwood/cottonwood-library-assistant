name: Verify bot delivery with library handoff update
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: library-handoff-delivery-test
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Save and verify the prepared library skill update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin setup/library-handoff
          git switch -c codex/library-handoff-validation
          git checkout origin/setup/library-handoff -- plugins/cottonwood-library/plugin.json plugins/cottonwood-library/skills/library-assistant/SKILL.md
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('plugins/cottonwood-library')
          d=json.loads((p/'plugin.json').read_text())
          assert d['name']=='cottonwood-library' and d['version']=='0.1.1'
          assert 'ChatGPT to Codex handoff' in (p/'skills/library-assistant/SKILL.md').read_text()
          PYCODE
          git config user.name 'Cottonwood Library Assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Teach ChatGPT the library website handoff'
          head=$(git rev-parse HEAD)
          git push origin codex/library-handoff-validation
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          ChatGPT was confusing access to website files with the ability to edit and preview the site. The installed library skill now explains the Codex handoff immediately for both capability questions and requested changes. This saves the already published 0.1.1 package source; no website content changes.

          Validation: library-account private plugin update and readback; exact-source cloud website checks required before saving. The bot merge also verifies delivery of the library's upkeep notification.
          BODY
          pr=$(gh pr create --base main --head codex/library-handoff-validation --title 'Library website upkeep' --body-file "$RUNNER_TEMP/pr-body.md")
          printf '%s\n' "$pr" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run check.yml --ref codex/library-handoff-validation
          for attempt in $(seq 1 40); do
            conclusion=$(gh run list --workflow check.yml --commit "$head" --event workflow_dispatch --json conclusion,status --jq 'map(select(.status=="completed"))[0].conclusion // ""')
            if [ "$conclusion" = success ]; then break; fi
            if [ -n "$conclusion" ]; then exit 1; fi
            sleep 10
          done
          test "$conclusion" = success
          gh pr merge "$pr" --squash --match-head-commit "$head" --delete-branch
          gh workflow run check.yml --ref main
