name: Verify library website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, 08:37 Pacific standard time / 09:37 Pacific daylight time.
    - cron: '37 16 * * *'
permissions:
  contents: read
# A newer push to the same PR cancels its older check, so superseded heads never
# preview. Main, scheduled and manual checks each get their own group: never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('library-check-pr-{0}', github.head_ref) || format('library-check-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.15.1
      # Actions minutes are limited. A PR that only changes instructions/docs or
      # content-update files skips the fixture browser, CMS and connector checks below:
      # they cannot change. Pushes to main, daily and manual checks always run everything.
      - name: Find what this PR changes
        id: kind
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/change-kind.mjs
      - run: bash scripts/cloud-setup.sh
      - run: node --test scripts/motion.test.mjs scripts/release.test.mjs scripts/publish-live.test.mjs scripts/content-changes.test.mjs scripts/stale-saves.test.mjs scripts/images.test.mjs scripts/connections.test.mjs scripts/library-account.test.mjs scripts/schedule.test.mjs scripts/site-paths.test.mjs scripts/sanity-backup.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_cms_artifacts.py'
      - if: steps.kind.outputs.kind == '' || steps.kind.outputs.kind == 'code'
        run: node scripts/analytics.test.mjs
      - name: Verify CMS content, forms, and publisher without accounts or deployment
        if: steps.kind.outputs.kind == '' || steps.kind.outputs.kind == 'code'
        env:
          SANITY_TELEMETRY_DISABLED: '1'
        run: bash scripts/cms-check.sh
      - name: Verify private Analytics connector without credentials
        if: steps.kind.outputs.kind == '' || steps.kind.outputs.kind == 'code'
        run: |
          npm ci --prefix connector --ignore-scripts
          npm test --prefix connector
          node --test scripts/analytics-recovery-browser.test.mjs
          npm run build --prefix connector
      - name: Save and inspect a version
        if: steps.kind.outputs.kind == '' || steps.kind.outputs.kind == 'code'
        run: |
          version=$(node scripts/release.mjs prepare)
          node scripts/capture.mjs "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: library-preview-and-screenshots
          path: output/
          retention-days: 7
  pr-preview:
    # Public published content only; no CMS, GitHub-write or hosting secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBRARY_CONTENT_SOURCE: sanity
      SANITY_PROJECT_ID: 2ou0xy2r
      SANITY_DATASET: production
      SANITY_SNAPSHOT_PATH: ${{ github.workspace }}/output/cms/snapshot.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Instructions-only PRs change nothing on the website: no preview to build.
      # publish-live.yml checks the PR's files again with trusted code before it accepts that.
      - name: Find what this PR changes
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/change-kind.mjs
      - if: steps.kind.outputs.kind != 'docs'
        run: npm install --global pnpm@11.15.1
      - if: steps.kind.outputs.kind != 'docs'
        run: pnpm install --frozen-lockfile
      # GitHub's runner already has Chromium (scripts/browser.mjs uses it); download one only if it is missing.
      - if: steps.kind.outputs.kind != 'docs'
        run: if [ ! -x /usr/bin/chromium ]; then pnpm exec playwright install --with-deps chromium; fi
      - if: steps.kind.outputs.kind != 'docs'
        run: pnpm cms:snapshot --out output/cms/snapshot.json
      # pnpm check runs in the verify job on this same PR; it does not depend on content.
      - if: steps.kind.outputs.kind != 'docs'
        run: pnpm build
      - if: steps.kind.outputs.kind != 'docs'
        run: node scripts/publish-live.mjs bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.kind.outputs.kind != 'docs'
        with:
          name: library-pr-checked-preview
          path: |
            output/cms/operation.json
            output/cms/snapshot.json
            output/releases/
            output/playwright/
          retention-days: 7
          if-no-files-found: error
  cms-live:
    needs: verify
    # This is separate from fixture/source checks. No account setup, imports,
    # approvals, mutation tokens, or deployment are performed by this job.
    if: github.repository == 'librarycottonwood/cottonwood-library-assistant' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LIBRARY_CONTENT_SOURCE == 'sanity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBRARY_CONTENT_SOURCE: sanity
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
      - name: Read and validate actual published CMS content
        id: content
        env:
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: |
          pnpm cms:doctor
          pnpm cms:snapshot --out output/cms-health/published-snapshot.json
      - name: Build from that frozen snapshot without a CMS token
        id: render
        env:
          SANITY_SNAPSHOT_PATH: ${{ github.workspace }}/output/cms-health/published-snapshot.json
        run: pnpm build
      - name: Check CMS publication status and reconcile missed deliveries into previews
        id: publisher
        env:
          CMS_PUBLISHER_ORIGIN: ${{ vars.CMS_PUBLISHER_ORIGIN }}
          CMS_STATUS_TOKEN: ${{ secrets.CMS_STATUS_TOKEN }}
        run: node scripts/cms-health.mjs
      - name: Record the scope and result without publishing content or credentials
        if: always()
        env:
          CONTENT_RESULT: ${{ steps.content.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          PUBLISHER_RESULT: ${{ steps.publisher.outcome }}
        run: |
          node --input-type=module <<'JS'
          import {mkdir, writeFile} from 'node:fs/promises';
          const contentRead = process.env.CONTENT_RESULT === 'success';
          const render = process.env.RENDER_RESULT === 'success';
          const publisher = process.env.PUBLISHER_RESULT === 'success';
          const report = {
            sourceSha: process.env.GITHUB_SHA,
            checkedAt: new Date().toISOString(),
            result: contentRead && render && publisher ? 'published_content_and_publisher_checked' : 'check_failed',
            contentRead, render, publisher,
            livePublishingVerified: false,
            scope: 'Read actual published content, build its frozen snapshot, check publisher status, and reconcile missed deliveries into pending previews. No content mutation, approval, deployment, or ChatGPT tool check; publication evidence remains per operation.',
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          await mkdir('output/cms-health', {recursive: true});
          await writeFile('output/cms-health/report.json', JSON.stringify(report, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: library-cms-health
          path: |
            output/cms-health/report.json
            output/cms-health/publisher.json
          retention-days: 7
          if-no-files-found: warn
  record-result:
    needs: [verify, cms-live]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: library-check-records
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.cms-live.result != 'skipped'
        continue-on-error: true
        with:
          name: library-cms-health
          path: cms-health-report
      - name: Record checked source for the library assistant
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRARY_CHECK_RESULT: ${{ needs.verify.result }}
          LIBRARY_CMS_LIVE_RESULT: ${{ needs.cms-live.result }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['GITHUB_SHA']
          branch = 'maintenance-reports'
          root = f'https://api.github.com/repos/{repo}'
          def api(path, method='GET', body=None):
              request = urllib.request.Request(root + path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          try:
              api('/git/ref/heads/' + branch)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              api('/git/refs', 'POST', {'ref': 'refs/heads/' + branch, 'sha': source})
          path = '/contents/.library-checks/' + source + '.json'
          source_result = os.environ['LIBRARY_CHECK_RESULT']
          cms_live_result = os.environ['LIBRARY_CMS_LIVE_RESULT']
          overall_result = source_result if source_result != 'success' else ('failure' if cms_live_result not in ('success', 'skipped') else 'success')
          report = {'sourceSha': source, 'result': overall_result, 'sourceChecksResult': source_result, 'cmsLiveResult': cms_live_result,
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'runUrl': f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'scope': 'Website build/release/privacy/browser checks; CMS migration tests; Studio fixture compilation/schema checks; local publisher runtime tests/dry build. cmsLiveResult records the separately gated published-content read/build, or skipped until configured. No account approval, hosted uptime, or public publishing verification.'}
          body = {'branch': branch, 'message': 'Record website checks for ' + source[:7],
              'content': base64.b64encode((json.dumps(report, indent=2) + '\n').encode()).decode()}
          try:
              body['sha'] = api(path + '?ref=' + branch)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          api(path, 'PUT', body)
          cms_report = {'sourceSha': source, 'checkedAt': report['checkedAt'], 'result': cms_live_result,
              'scope': 'Separate CMS content/publisher check; skipped until library account setup. No private token or CMS document export.'}
          for name in ('report', 'publisher'):
              file = Path('cms-health-report') / (name + '.json')
              if file.exists():
                  cms_report[name] = json.loads(file.read_text())
          cms_path = '/contents/.library-cms-checks/latest.json'
          cms_body = {'branch': branch, 'message': 'Record CMS check for ' + source[:7],
              'content': base64.b64encode((json.dumps(cms_report, indent=2) + '\n').encode()).decode()}
          try:
              cms_body['sha'] = api(cms_path + '?ref=' + branch)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          api(cms_path, 'PUT', cms_body)
          PY
      - name: Keep source and CMS preview storage within the free artifact budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cms-artifacts.py
