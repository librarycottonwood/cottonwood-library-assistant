name: Verify library website
on:
  push:
    branches-ignore:
      - maintenance-reports
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, 08:37 Pacific standard time / 09:37 Pacific daylight time.
    - cron: '37 16 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.15.1
      - run: bash scripts/cloud-setup.sh
      - run: node --test scripts/release.test.mjs
      - run: node scripts/analytics.test.mjs
      - name: Save and inspect a version
        run: |
          version=$(node scripts/release.mjs prepare)
          node scripts/capture.mjs "$version"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-preview-and-screenshots
          path: output/
          retention-days: 7
  record-result:
    needs: verify
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: library-check-records
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Record checked source for the library assistant
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRARY_CHECK_RESULT: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['GITHUB_SHA']
          branch = 'maintenance-reports'
          root = f'https://api.github.com/repos/{repo}'
          def api(path, method='GET', body=None):
              request = urllib.request.Request(root + path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          try:
              api('/git/ref/heads/' + branch)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              api('/git/refs', 'POST', {'ref': 'refs/heads/' + branch, 'sha': source})
          path = '/contents/.library-checks/' + source + '.json'
          report = {'sourceSha': source, 'result': os.environ['LIBRARY_CHECK_RESULT'],
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'runUrl': f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'scope': 'Build, release safeguards, privacy consent, and desktop/phone page checks; not hosted uptime or public publishing.'}
          body = {'branch': branch, 'message': 'Record website checks for ' + source[:7],
              'content': base64.b64encode((json.dumps(report, indent=2) + '\n').encode()).decode()}
          try:
              body['sha'] = api(path + '?ref=' + branch)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          api(path, 'PUT', body)
          PY
      - name: Keep screenshot storage within the trial budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/actions/artifacts?per_page=100']))
          artifacts = [a for p in pages for a in p['artifacts'] if a['name']=='library-preview-and-screenshots' and not a['expired']]
          artifacts.sort(key=lambda a: (a['created_at'],a['id']), reverse=True)
          for artifact in artifacts[7:]:
              subprocess.run(['gh','api',f"repos/{repo}/actions/artifacts/{artifact['id']}",'-X','DELETE'],check=True)
          print('Retained the seven most recent website screenshot archives. Hosted previews remain available.')
          PY
